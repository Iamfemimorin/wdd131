<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Submit a product review by selecting a product, rating it, and sharing your experience.">
    <meta name="author" content="Martins Amorin">
    <title>Product Review Form | WDD 131</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <main class="page-wrapper">
        <section class="form-card" aria-labelledby="page-title">
            <header class="form-header">
                <p class="eyebrow">WDD 131 • Weekly Assignment</p>
                <h1 id="page-title">Product Review</h1>
                <p class="intro">Tell us about the product you installed. Fields marked with <span class="required-mark" aria-hidden="true">*</span> are required.</p>
            </header>

            <form method="get" action="review.html">
                <fieldset>
                    <legend>Product Information</legend>

                    <label for="productName">Product Name <span class="required-mark" aria-hidden="true">*</span></label>
                    <select id="productName" name="productName" required>
                        <option value="" disabled selected>Select a Product ...</option>
                    </select>

                    <fieldset class="rating-group">
                        <legend>Overall Rating <span class="required-mark" aria-hidden="true">*</span></legend>

                        <div class="rating-options">
                            <label for="rating1">
                                <input type="radio" id="rating1" name="rating" value="1" required>
                                <span aria-hidden="true">☆</span> 1
                            </label>

                            <label for="rating2">
                                <input type="radio" id="rating2" name="rating" value="2" required>
                                <span aria-hidden="true">☆</span> 2
                            </label>

                            <label for="rating3">
                                <input type="radio" id="rating3" name="rating" value="3" required>
                                <span aria-hidden="true">☆</span> 3
                            </label>

                            <label for="rating4">
                                <input type="radio" id="rating4" name="rating" value="4" required>
                                <span aria-hidden="true">☆</span> 4
                            </label>

                            <label for="rating5">
                                <input type="radio" id="rating5" name="rating" value="5" required>
                                <span aria-hidden="true">☆</span> 5
                            </label>
                        </div>
                    </fieldset>
                </fieldset>

                    <label for="installDate">Date of Installation <span class="required-mark" aria-hidden="true">*</span></label>
                    <input type="date" id="installDate" name="installDate" required>
                </fieldset>

                <fieldset>
                    <legend>Review Details</legend>

                    <fieldset class="features-group">
                        <legend>Useful Features <span class="optional-text">(Check all that apply)</span></legend>
                        <div class="checkbox-options">
                            <label for="featureEasy"><input type="checkbox" id="featureEasy" name="features" value="easy-to-use"> Easy to use</label>
                            <label for="featureQuality"><input type="checkbox" id="featureQuality" name="features" value="quality"> Quality</label>
                            <label for="featurePerformance"><input type="checkbox" id="featurePerformance" name="features" value="performance"> Performance</label>
                            <label for="featureValue"><input type="checkbox" id="featureValue" name="features" value="value"> Good value</label>
                        </div>
                    </fieldset>

                    <label for="writtenReview">Written Review <span class="optional-text">(Optional)</span></label>
                    <textarea id="writtenReview" name="writtenReview" rows="6" placeholder="Share your experience with this product..."></textarea>

                    <label for="userName">User Name <span class="optional-text">(Optional)</span></label>
                    <input type="text" id="userName" name="userName" autocomplete="name">
                </fieldset>

                <input class="submit-button" type="submit" value="Submit Review">
            </form>
        </section>
    </main>

    <footer>
        <p>© <span id="currentyear"></span> Martins Amorin | Nigeria</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
